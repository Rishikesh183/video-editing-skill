<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"player","type":"string","label":"Player name","default":"SANJU SAMSON"},
  {"id":"headline","type":"string","label":"Headline","default":"PLAYING VERY WELL RECENTLY"},
  {"id":"stat_lines","type":"string","label":"Stat lines (JSON array, max 3)","default":"[\"Under constant pressure\",\"Scoring runs consistently\"]"},
  {"id":"photo","type":"string","label":"Photo path","default":""},
  {"id":"cutout","type":"string","label":"Cut-out path","default":""},
  {"id":"accent","type":"color","label":"Accent","default":"#FF7A1A"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { width: __W__px; height: __H__px; }
      .photo-frame { position: absolute; }
      .text { position: absolute; }
      .player { white-space: nowrap; }
      .headline { letter-spacing: .08em; }
      .chips { display: flex; flex-direction: column; }
      .chip { display: flex; align-items: center; border-radius: 18px; }
      .chip::before { content: ""; flex: none; background: var(--accent); border-radius: 50%; }

      .portrait .photo-frame { left: 240px; top: 170px; width: 600px; height: 660px; }
      .portrait .text { left: 60px; right: 60px; top: 990px; text-align: center; }
      .portrait .player { font-size: 130px; }
      .portrait .headline { font-size: 48px; margin-top: 14px; }
      .portrait .chips { gap: 14px; margin-top: 26px; align-items: center; }
      .portrait .chip { font-size: 38px; padding: 12px 26px; gap: 18px; }
      .portrait .chip::before { width: 16px; height: 16px; }

      .landscape .photo-frame { left: 160px; top: 120px; width: 560px; height: 680px; }
      .landscape .text { left: 900px; right: 100px; top: 200px; }
      .landscape .player { font-size: 130px; }
      .landscape .headline { font-size: 46px; margin-top: 14px; }
      .landscape .chips { gap: 16px; margin-top: 36px; align-items: flex-start; }
      .landscape .chip { font-size: 40px; padding: 14px 28px; gap: 18px; }
      .landscape .chip::before { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="scene" class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="photo-frame" id="photo"></div>
        <div class="text" id="text">
          <div class="player display shadow" id="player"></div>
          <div class="headline accent shadow" id="headline"></div>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </div>
    <script src="assets/base.js"></script>
    <script>
      const v = HF.vars;
      const dur = __DUR__;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      const fx = HF.backdrop(tl, { photo: v.photo, dur });
      HF.text("#player", v.player);
      HF.text("#headline", v.headline);
      const chips = HF.$("#chips");
      HF.list(v.stat_lines).slice(0, 3).forEach((line) => {
        const chip = document.createElement("div");
        chip.className = "chip panel";
        chip.textContent = String(line).toUpperCase();
        chips.appendChild(chip);
      });
      // A cut-out hero replaces the framed photo; without either, initials keep the frame.
      const hero = HF.cutout(v.cutout, HF.portrait
        ? { left: "6%", width: "88%", top: "90px", height: "880px" }
        : { left: "1%", width: "44%", top: "40px", bottom: "0" });
      if (hero) HF.$("#photo").style.display = "none"; else HF.photo("#photo", v.photo, v.player);
      HF.$("#scene").appendChild(HF.$("#text"));
      HF.afterFonts(() => HF.fit(HF.$("#player")));

      const heroEl = hero || HF.$("#photo");
      HF.flash(tl, fx, 0);
      tl.from(heroEl, { y: 220, scale: 0.88, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.08)
        .to(heroEl, { scale: 1.05, duration: dur - 0.7, ease: "none" }, 0.68)
        .from("#player", { scale: 2.3, opacity: 0, duration: 0.25, ease: "power4.in" }, 0.3);
      HF.shake(tl, "#scene", 0.55, 16);
      tl.from("#headline", { y: 30, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.75)
        .from(".chip", { x: 80, opacity: 0, duration: 0.35, stagger: 0.25, ease: "back.out(1.6)" }, 1.0);
      HF.sweep(tl, fx, 1.6);
      HF.leak(tl, fx, 0.1, 1.0);
      tl.to("#scene", { opacity: 0, duration: 0.3 }, dur - 0.3);
      tl.seek(0);
    </script>
  </body>
</html>
