<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Name / title","default":"NITHISH KUMAR REDDY"},
  {"id":"caption","type":"string","label":"Caption","default":"BATTING DEPTH AT No.8"},
  {"id":"photo","type":"string","label":"Photo path","default":""},
  {"id":"cutout","type":"string","label":"Cut-out path","default":""},
  {"id":"accent","type":"color","label":"Accent","default":"#FF7A1A"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { width: __W__px; height: __H__px; }
      .tag { position: absolute; }
      .tag .bar { display: inline-block; background: var(--accent); color: var(--ground); padding: .12em .45em; transform-origin: 0 50%; }
      .tag .sub { display: inline-block; background: rgba(8,12,30,.85); color: var(--ink); padding: .2em .6em; margin-top: 10px; letter-spacing: .08em; transform-origin: 0 50%; }
      .portrait .tag { left: 60px; right: 60px; top: 1180px; }
      .portrait .tag .bar { font-size: 92px; }
      .portrait .tag .sub { font-size: 42px; }
      .landscape .tag { left: 100px; right: 100px; top: 640px; }
      .landscape .tag .bar { font-size: 90px; }
      .landscape .tag .sub { font-size: 40px; }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="scene" class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="tag" id="tag">
          <div><span class="bar display" id="title"></span></div>
          <div><span class="sub" id="caption"></span></div>
        </div>
      </div>
    </div>
    <script src="assets/base.js"></script>
    <script>
      const v = HF.vars;
      const dur = __DUR__;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // With a cut-out: 2.5D parallax (blurred plate drifts slowly, the player pushes in faster).
      // Without: the sharp photo itself does a Ken Burns push.
      const fx = HF.backdrop(tl, { photo: v.photo, sharp: !v.cutout, dur });
      const hero = HF.cutout(v.cutout, HF.portrait
        ? { left: "-4%", width: "108%", top: "80px", height: "1150px" }
        : { left: "15%", width: "70%", top: "0", bottom: "0" });
      if (hero) tl.fromTo(hero, { scale: 1.0, y: 40 }, { scale: 1.16, y: 0, duration: dur, ease: "none" }, 0);
      HF.$("#scene").appendChild(HF.$("#tag"));
      HF.text("#title", v.title);
      HF.text("#caption", v.caption);
      if (!v.caption) HF.$("#caption").style.display = "none";

      // Camera-flash entrance: white frame, shutter, light leak.
      HF.flash(tl, fx, 0, 1);
      HF.leak(tl, fx, 0.15, 1.3);
      if (hero) tl.from(hero, { opacity: 0, duration: 0.25 }, 0.05);
      tl.from("#title", { scaleX: 0, duration: 0.35, ease: "power3.out" }, 0.6)
        .from("#caption", { scaleX: 0, duration: 0.35, ease: "power3.out" }, 0.8);
      HF.sweep(tl, fx, 1.4);
      tl.to("#scene", { opacity: 0, duration: 0.3 }, dur - 0.3);
      tl.seek(0);
    </script>
  </body>
</html>
