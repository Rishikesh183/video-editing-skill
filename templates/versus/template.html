<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Small label above the title","default":"HEAD TO HEAD"},
  {"id":"title","type":"string","label":"Title","default":"Who bats deeper?"},
  {"id":"left","type":"string","label":"Left side name","default":"Nitish Reddy"},
  {"id":"right","type":"string","label":"Right side name","default":"Axar Patel"},
  {"id":"rows","type":"string","label":"Rows: JSON [{\"label\":..,\"left\":..,\"right\":..,\"low\":false}]","default":"[{\"label\":\"Batting position\",\"left\":8,\"right\":7,\"low\":true},{\"label\":\"Strike rate\",\"left\":142,\"right\":128},{\"label\":\"Wickets\",\"left\":11,\"right\":19}]"},
  {"id":"cutouts","type":"string","label":"Player cut-outs (filled by the server)","default":"[]"},
  {"id":"left_color","type":"color","label":"Left colour","default":"#FF7A1A"},
  {"id":"right_color","type":"color","label":"Right colour","default":"#3D8BFF"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFD23F"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { width: __W__px; height: __H__px; }
      #root { background: #06070F; }
      .half { position: absolute; top: 0; bottom: 0; width: 50%; }
      .half.l { left: 0; background: radial-gradient(80% 60% at 30% 35%, color-mix(in srgb, var(--lc) 38%, transparent), transparent 70%); }
      .half.r { right: 0; background: radial-gradient(80% 60% at 70% 35%, color-mix(in srgb, var(--rc) 38%, transparent), transparent 70%); }
      .split { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px;
        background: linear-gradient(180deg, transparent, rgba(255,255,255,.35), transparent); }
      .head { position: absolute; left: 0; right: 0; text-align: center; }
      .kicker { font-family: "Inter"; font-weight: 700; letter-spacing: .32em; color: var(--accent); }
      .title { font-family: "Montserrat"; font-weight: 800; color: #fff; line-height: 1.05; }
      .title .w { display: inline-block; margin: 0 .12em; }
      .side { position: absolute; }
      .side img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; display: block; }
      .mono { position: absolute; inset: 15% 15% 0 15%; border-radius: 50% 50% 0 0; display: flex; align-items: center;
        justify-content: center; font-family: "Archivo Black"; color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }
      .name { position: absolute; font-family: "Archivo Black"; color: #fff; text-transform: uppercase; white-space: nowrap;
        padding: 10px 22px; border-radius: 10px; }
      .name.l { background: var(--lc); }
      .name.r { background: var(--rc); }
      .vs { position: absolute; left: 0; right: 0; text-align: center; font-family: "Archivo Black"; color: #fff;
        text-shadow: 0 0 40px rgba(255,255,255,.35); }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .rows { position: absolute; }
      .row { position: relative; }
      .rl { text-align: center; font-family: "Inter"; font-weight: 800; letter-spacing: .18em; color: rgba(255,255,255,.6); text-transform: uppercase; }
      .bars { position: relative; }
      .bar { position: absolute; top: 0; bottom: 0; border-radius: 999px; opacity: .85; }
      .bar.l { right: 50%; transform-origin: 100% 50%; background: var(--lc); }
      .bar.r { left: 50%; transform-origin: 0 50%; background: var(--rc); }
      .val { position: absolute; font-family: "Archivo Black"; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
      .val.win { color: #fff; }
      .val.win::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 6px; border-radius: 3px; background: var(--accent); }

      .portrait .head { top: 110px; }
      .portrait .kicker { font-size: 30px; }
      .portrait .title { font-size: 72px; margin-top: 16px; }
      .portrait .side { top: 330px; width: 560px; height: 680px; }
      .portrait .side.l { left: -20px; }
      .portrait .side.r { right: -20px; }
      .portrait .mono { font-size: 150px; }
      .portrait .name { top: 990px; font-size: 40px; max-width: 480px; overflow: hidden; }
      .portrait .name.l { left: 50px; }
      .portrait .name.r { right: 50px; }
      .portrait .vs { top: 560px; font-size: 150px; }
      .portrait .rows { left: 70px; right: 70px; top: 1170px; transform-origin: 50% 0; }
      .portrait .row { height: 165px; }
      .portrait .rl { font-size: 28px; }
      .portrait .bars { margin: 30px auto 0; width: 480px; height: 30px; }
      .portrait .val { top: -20px; font-size: 64px; }
      .portrait .val.l { left: -200px; width: 180px; text-align: right; }
      .portrait .val.r { right: -200px; width: 180px; }

      .landscape .head { top: 60px; }
      .landscape .kicker { font-size: 24px; }
      .landscape .title { font-size: 62px; margin-top: 10px; }
      .landscape .side { bottom: 0; width: 600px; height: 860px; }
      .landscape .side.l { left: -40px; }
      .landscape .side.r { right: -40px; }
      .landscape .mono { font-size: 140px; }
      .landscape .name { bottom: 60px; font-size: 38px; }
      .landscape .name.l { left: 60px; }
      .landscape .name.r { right: 60px; }
      .landscape .vs { top: 200px; font-size: 110px; }
      .landscape .rows { left: 560px; right: 560px; top: 400px; }
      .landscape .row { height: 170px; }
      .landscape .rl { font-size: 24px; }
      .landscape .bars { margin: 18px auto 0; width: 440px; height: 28px; }
      .landscape .val { top: -6px; font-size: 64px; }
      .landscape .val.l { left: -150px; width: 130px; text-align: right; }
      .landscape .val.r { right: -150px; width: 130px; }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="scene" class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="half l" id="hl"></div><div class="half r" id="hr"></div>
        <div class="split" id="split"></div>
        <div class="side l" id="sl"></div><div class="side r" id="sr"></div>
        <div class="name l" id="nl"></div><div class="name r" id="nr"></div>
        <div class="head"><div class="kicker" id="kicker"></div><div class="title" id="title"></div></div>
        <div class="vs" id="vs">VS</div>
        <div class="rows" id="rows"></div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <script src="assets/base.js"></script>
    <script>
      const v = HF.vars;
      const dur = __DUR__;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const root = HF.$("#root");
      root.style.setProperty("--lc", v.left_color || "#FF7A1A");
      root.style.setProperty("--rc", v.right_color || "#3D8BFF");

      HF.text("#kicker", String(v.kicker || "").toUpperCase());
      String(v.title || "").split(/\s+/).filter(Boolean).forEach((w) => {
        const s = document.createElement("span"); s.className = "w"; s.textContent = w; HF.$("#title").appendChild(s);
      });
      HF.text("#nl", v.left); HF.text("#nr", v.right);
      const cuts = HF.list(v.cutouts);
      [["#sl", cuts[0], v.left], ["#sr", cuts[1], v.right]].forEach(([sel, src, name]) => {
        if (src) { const img = document.createElement("img"); img.src = src; HF.$(sel).appendChild(img); }
        else {
          const m = document.createElement("div"); m.className = "mono";
          m.textContent = String(name || "?").split(/\s+/).map((w) => w[0] || "").join("").slice(0, 2).toUpperCase();
          HF.$(sel).appendChild(m);
        }
      });

      const rows = HF.list(v.rows).filter((r) => r && typeof r === "object").slice(0, 3);
      // Fewer rows get more room: one row is shown big and centred in the lower area.
      if (rows.length > 0 && rows.length < 3) {
        HF.$("#rows").style.transform = `translateY(${(3 - rows.length) * 70}px) scale(${1 + (3 - rows.length) * 0.18})`;
      }
      const built = rows.map((r) => {
        const a = Number(r.left) || 0, b = Number(r.right) || 0, top = Math.max(1, Math.abs(a), Math.abs(b));
        const lWins = r.low ? a < b : a > b, rWins = r.low ? b < a : b > a;
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = '<div class="rl"></div><div class="bars"><div class="bar l"></div><div class="bar r"></div>' +
          '<div class="val l"></div><div class="val r"></div></div>';
        row.querySelector(".rl").textContent = r.label || "";
        const vl = row.querySelector(".val.l"), vr = row.querySelector(".val.r");
        vl.textContent = String(r.left ?? ""); vr.textContent = String(r.right ?? "");
        if (lWins) vl.classList.add("win");
        if (rWins) vr.classList.add("win");
        // With "low is better" the shorter number gets the longer bar.
        const share = (x) => r.low ? Math.min(Math.abs(a), Math.abs(b)) / Math.max(1e-9, Math.abs(x)) : Math.abs(x) / top;
        row.querySelector(".bar.l").style.width = (50 * share(a)).toFixed(2) + "%";
        row.querySelector(".bar.r").style.width = (50 * share(b)).toFixed(2) + "%";
        HF.$("#rows").appendChild(row);
        return row;
      });
      if (HF.portrait) built.forEach((row) => {  // values sit at the outer ends of the bars
        row.querySelector(".bars").style.width = "480px";
      });

      // Shared with sound cues (hfpipe/cues.py "versus").
      const T_SIDES = 0.35, T_VS = 0.9, T_ROWS = 1.35, STEP = 0.35;
      tl.from("#kicker", { y: -20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.05)
        .from("#title .w", { opacity: 0, y: 26, duration: 0.5, ease: "expo.out", stagger: 0.08 }, 0.12)
        .from("#hl", { xPercent: -100, duration: 0.7, ease: "expo.out" }, 0)
        .from("#hr", { xPercent: 100, duration: 0.7, ease: "expo.out" }, 0)
        .from("#split", { scaleY: 0, duration: 0.6, ease: "expo.out" }, 0.2)
        .from("#sl", { x: -420, opacity: 0, duration: 0.8, ease: "expo.out" }, T_SIDES)
        .from("#sr", { x: 420, opacity: 0, duration: 0.8, ease: "expo.out" }, T_SIDES + 0.08)
        .from("#nl", { x: -60, opacity: 0, duration: 0.5, ease: "expo.out" }, T_SIDES + 0.3)
        .from("#nr", { x: 60, opacity: 0, duration: 0.5, ease: "expo.out" }, T_SIDES + 0.38)
        .fromTo("#vs", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, T_VS)
        .fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, T_VS + 0.15);
      HF.shake(tl, "#scene", T_VS + 0.15, 12);
      built.forEach((row, i) => {
        const at = T_ROWS + i * STEP;
        tl.from(row.querySelector(".rl"), { opacity: 0, y: 14, duration: 0.4, ease: "expo.out" }, at)
          .from(row.querySelectorAll(".bar"), { scaleX: 0, duration: 0.8, ease: "expo.out" }, at + 0.05)
          .from(row.querySelectorAll(".val"), { opacity: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.6)" }, at + 0.2);
      });
      tl.to("#scene", { opacity: 0, duration: 0.25, ease: "power2.in" }, dur - 0.25);
      tl.seek(0);
    </script>
  </body>
</html>
