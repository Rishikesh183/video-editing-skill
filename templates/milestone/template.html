<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"player","type":"string","label":"Player","default":"GLENN PHILLIPS"},
  {"id":"value","type":"string","label":"Big value","default":"82*"},
  {"id":"label","type":"string","label":"Label","default":"NOT OUT"},
  {"id":"photo","type":"string","label":"Photo path","default":""},
  {"id":"cutout","type":"string","label":"Cut-out path","default":""},
  {"id":"accent","type":"color","label":"Accent","default":"#FF7A1A"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { width: __W__px; height: __H__px; }
      .rays {
        position: absolute; border-radius: 50%; opacity: .35;
        background: repeating-conic-gradient(var(--accent) 0deg 8deg, transparent 8deg 24deg);
        -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%);
        mask: radial-gradient(circle, #000 20%, transparent 70%);
      }
      .center { position: absolute; text-align: center; }
      .value { color: var(--ink); text-shadow: 0 0 60px var(--accent); }
      .label { letter-spacing: .25em; color: var(--accent); }
      .who { display: flex; align-items: center; justify-content: center; }
      .who .photo-frame { border-radius: 50%; flex: none; }
      .who .name { white-space: nowrap; }

      .portrait .rays { width: 1600px; height: 1600px; left: -260px; top: 0; }
      .portrait .center { left: 60px; right: 60px; top: 330px; }
      .portrait .value { font-size: 420px; }
      .portrait .label { font-size: 80px; margin-top: 10px; }
      .portrait .who { gap: 30px; margin-top: 90px; }
      .portrait .who .photo-frame { width: 220px; height: 220px; }
      .portrait .who .name { font-size: 80px; }

      .landscape .rays { width: 1500px; height: 1500px; left: 210px; top: -330px; }
      .landscape .center { left: 100px; right: 100px; top: 90px; }
      .landscape .value { font-size: 380px; }
      .landscape .label { font-size: 70px; }
      .landscape .who { gap: 26px; margin-top: 30px; }
      .landscape .who .photo-frame { width: 170px; height: 170px; }
      .landscape .who .name { font-size: 70px; }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="scene" class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="rays" id="rays"></div>
        <div class="center" id="center">
          <div class="value display" id="value"></div>
          <div class="label display" id="label"></div>
          <div class="who">
            <div class="photo-frame" id="photo"></div>
            <div class="name display shadow" id="name"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/base.js"></script>
    <script>
      const v = HF.vars;
      const dur = __DUR__;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      const fx = HF.backdrop(tl, { photo: v.photo, dur });
      HF.$("#scene").appendChild(HF.$("#rays"));
      // The cut-out stands behind the number, like a poster.
      const hero = HF.cutout(v.cutout, HF.portrait
        ? { left: "0", width: "100%", top: "120px", height: "1100px" }
        : { left: "25%", width: "50%", top: "20px", bottom: "0" });
      if (hero) hero.style.opacity = "0.85";
      HF.$("#scene").appendChild(HF.$("#center"));
      HF.text("#value", v.value);
      HF.text("#label", v.label);
      HF.text("#name", v.player);
      HF.photo("#photo", v.photo, v.player);
      HF.afterFonts(() => { HF.fit(HF.$("#value")); HF.fit(HF.$("#name"), HF.$(".center").clientWidth - 260); });

      tl.from("#rays", { scale: 0, opacity: 0, duration: 0.6, ease: "power3.out" }, 0)
        .to("#rays", { rotation: 40, duration: dur, ease: "none" }, 0);
      if (hero) tl.from(hero, { scale: 1.3, opacity: 0, duration: 0.7, ease: "power3.out" }, 0).to(hero, { scale: 1.06, duration: dur - 0.7, ease: "none" }, 0.7);
      tl.from("#value", { scale: 3, opacity: 0, duration: 0.45, ease: "power4.in" }, 0.2);
      HF.flash(tl, fx, 0.65, 0.7);
      HF.shake(tl, "#scene", 0.65, 18, 8);
      tl.from("#label", { y: 40, opacity: 0, duration: 0.4, ease: "back.out(2)" }, 0.9)
        .from("#photo", { scale: 0, duration: 0.45, ease: "back.out(1.8)" }, 1.2)
        .from("#name", { x: 80, opacity: 0, duration: 0.4, ease: "power3.out" }, 1.35);
      HF.leak(tl, fx, 1.0, 1.4);
      tl.to("#scene", { opacity: 0, duration: 0.3 }, dur - 0.3);
      tl.seek(0);
    </script>
  </body>
</html>
