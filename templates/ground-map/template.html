<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Small label above the title","default":"THE PLAN"},
  {"id":"title","type":"string","label":"Title","default":"Seven on the off side"},
  {"id":"fielders","type":"string","label":"Fielding positions (JSON list or a | b | c)","default":"[\"slip\",\"gully\",\"point\",\"cover\",\"mid-off\",\"deep cover\",\"third man\"]"},
  {"id":"highlight","type":"string","label":"Position to ring","default":"deep cover"},
  {"id":"shot","type":"string","label":"Where the ball went (a position name)","default":"long-on"},
  {"id":"shot_label","type":"string","label":"Word when it lands","default":"SIX"},
  {"id":"note","type":"string","label":"Line at the bottom","default":"He still found the gap"},
  {"id":"batter","type":"string","label":"Batter hand (right|left)","default":"right"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFD23F"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html, body { width: __W__px; height: __H__px; }
      #root { background: #050914; }
      .sky { position: absolute; inset: 0;
        background:
          radial-gradient(60% 40% at 15% 0%, rgba(120,150,255,.28), transparent 70%),
          radial-gradient(60% 40% at 85% 0%, rgba(120,150,255,.22), transparent 70%),
          radial-gradient(90% 70% at 50% 55%, #10204F 0%, #050914 75%); }
      .head { position: absolute; text-align: center; }
      .kicker { font-family: "Inter"; font-weight: 700; letter-spacing: .32em; color: var(--accent); }
      .title { font-family: "Montserrat"; font-weight: 800; line-height: 1.05; color: #fff; }
      .title .w { display: inline-block; margin: 0 .12em; }
      .note { position: absolute; text-align: center; font-family: "Montserrat"; font-weight: 700; color: #fff; }
      .note b { color: var(--accent); }
      svg { position: absolute; overflow: visible; }
      .lbl { font-family: "Inter"; font-weight: 700; font-size: 5px; fill: #fff; letter-spacing: .06em; }
      .hit { font-family: "Archivo Black"; fill: var(--accent); }

      .portrait .head { left: 70px; right: 70px; top: 120px; }
      .portrait .kicker { font-size: 30px; }
      .portrait .title { font-size: 70px; margin-top: 18px; }
      .portrait svg { left: 40px; top: 430px; width: 1000px; height: 1000px; }
      .portrait .note { left: 80px; right: 80px; top: 1530px; font-size: 52px; }

      .landscape .head { left: 1060px; right: 90px; top: 300px; text-align: left; }
      .landscape .kicker { font-size: 26px; }
      .landscape .title { font-size: 74px; margin-top: 16px; }
      .landscape .title .w { margin: 0 .24em 0 0; }
      .landscape svg { left: 110px; top: 70px; width: 940px; height: 940px; }
      .landscape .note { left: 1060px; right: 90px; top: 720px; font-size: 44px; text-align: left; }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="scene" class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="sky"></div>
        <svg id="field" viewBox="-110 -110 220 220">
          <defs>
            <radialGradient id="grass" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#2F9447" />
              <stop offset="100%" stop-color="#0F4A22" />
            </radialGradient>
            <pattern id="mow" width="16" height="220" patternUnits="userSpaceOnUse" x="-8">
              <rect width="8" height="220" fill="#ffffff" opacity=".045" />
            </pattern>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.6" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <clipPath id="oval"><circle r="96" /></clipPath>
          </defs>
          <g id="ground">
            <circle r="96" fill="url(#grass)" />
            <rect x="-110" y="-110" width="220" height="220" fill="url(#mow)" clip-path="url(#oval)" />
            <circle id="rope" r="96" fill="none" stroke="#ffffff" stroke-width="1.3" filter="url(#glow)" />
            <circle id="ring" r="45" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width=".7" stroke-dasharray="2.4 2.4" />
            <g id="pitch">
              <rect x="-3.4" y="-12" width="6.8" height="24" rx=".6" fill="#C9A86A" />
              <line x1="-4.6" y1="-9.6" x2="4.6" y2="-9.6" stroke="#fff" stroke-width=".35" />
              <line x1="-4.6" y1="9.6" x2="4.6" y2="9.6" stroke="#fff" stroke-width=".35" />
            </g>
          </g>
          <path id="trail" fill="none" style="stroke: var(--accent)" stroke-width="1.1" stroke-linecap="round" opacity="0" />
          <g id="fielders"></g>
          <circle id="ball" r="1.9" fill="#E10600" stroke="#fff" stroke-width=".5" opacity="0" />
          <text id="hit" class="hit" text-anchor="middle" font-size="16" opacity="0"></text>
        </svg>
        <div class="head" id="head">
          <div class="kicker" id="kicker"></div>
          <div class="title" id="title"></div>
        </div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <script src="assets/base.js"></script>
    <script>
      const v = HF.vars;
      const dur = __DUR__;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const NS = "http://www.w3.org/2000/svg";

      // Right-hander seen from behind the bowler: batter at the top end, off side on the left.
      const SPOTS = {
        "wicketkeeper": [0, -25], "keeper": [0, -25], "slip": [-8, -25], "first slip": [-8, -25],
        "second slip": [-14, -23], "gully": [-24, -18], "silly point": [-9, -8], "short leg": [9, -8],
        "point": [-37, -6], "cover": [-35, 14], "extra cover": [-26, 25], "mid-off": [-14, 37], "mid off": [-14, 37],
        "mid-on": [14, 37], "mid on": [14, 37], "midwicket": [35, 14], "mid wicket": [35, 14],
        "square leg": [37, -6], "fine leg": [26, -40], "short fine leg": [18, -32], "bowler": [0, 20],
        "third man": [-48, -76], "deep point": [-87, -14], "deep cover": [-75, 44], "sweeper": [-75, 44],
        "long-off": [-30, 87], "long off": [-30, 87], "long-on": [30, 87], "long on": [30, 87],
        "deep midwicket": [75, 44], "deep mid wicket": [75, 44], "cow corner": [62, 68],
        "deep square leg": [87, -14], "deep square": [87, -14], "deep fine leg": [48, -76], "long leg": [48, -76],
        "straight": [0, 92], "behind square": [70, -55], "over the keeper": [0, -92],
      };
      const lefty = String(v.batter).toLowerCase().startsWith("l");
      const norm = (s) => String(s || "").toLowerCase().replace(/_/g, " ").replace(/\s+/g, " ").trim();
      const spot = (name) => {
        const p = SPOTS[norm(name)] || SPOTS[norm(name).replace("-", " ")];
        return p ? [lefty ? -p[0] : p[0], p[1]] : null;
      };

      HF.text("#kicker", String(v.kicker || "").toUpperCase());
      const title = HF.$("#title");
      String(v.title || "").split(/\s+/).filter(Boolean).forEach((w) => {
        const s = document.createElement("span"); s.className = "w"; s.textContent = w; title.appendChild(s);
      });
      const note = String(v.note || "");
      HF.$("#note").innerHTML = "";
      HF.text("#note", note);

      const names = HF.list(v.fielders).map(norm).filter((n) => spot(n)).slice(0, 11);
      const group = HF.$("#fielders");
      const dots = names.map((name) => {
        const [x, y] = spot(name);
        const g = document.createElementNS(NS, "g");
        g.setAttribute("transform", `translate(${x} ${y})`);
        const hot = norm(v.highlight) === name;
        const halo = document.createElementNS(NS, "circle");
        halo.setAttribute("r", "2.6"); halo.setAttribute("fill", "none");
        halo.style.stroke = hot ? "var(--accent)" : "#fff"; halo.setAttribute("stroke-width", ".6");
        halo.setAttribute("opacity", "0");
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", "2.6"); dot.style.fill = hot ? "var(--accent)" : "#fff";
        dot.setAttribute("stroke", "#0B1026"); dot.setAttribute("stroke-width", ".6");
        // Label leans away from the centre, on a short leader line.
        const len = Math.hypot(x, y) || 1;
        const ux = x / len, uy = y / len;
        const out = Math.hypot(x, y) > 70 ? -1 : 1;  // deep fielders label inward so text stays on the ground
        const lx = ux * 9 * out, ly = uy * 9 * out + (Math.abs(uy) < .3 ? -5 : 0);
        const lead = document.createElementNS(NS, "line");
        lead.setAttribute("x1", ux * 3 * out); lead.setAttribute("y1", uy * 3 * out);
        lead.setAttribute("x2", lx); lead.setAttribute("y2", ly);
        lead.setAttribute("stroke", "#fff"); lead.setAttribute("stroke-opacity", ".7"); lead.setAttribute("stroke-width", ".35");
        const lbl = document.createElementNS(NS, "text");
        lbl.setAttribute("class", "lbl");
        lbl.setAttribute("x", lx + (lx >= 0 ? 1 : -1)); lbl.setAttribute("y", ly + 1.4);
        lbl.setAttribute("text-anchor", lx >= 0 ? "start" : "end");
        if (hot) lbl.style.fill = "var(--accent)";
        lbl.textContent = name.toUpperCase();
        g.append(halo, lead, dot, lbl);
        group.appendChild(g);
        return { g, dot, lead, lbl, halo, hot };
      });

      // Shared with sound cues (hfpipe/cues.py "ground-map").
      const T_FIELD = 0.9;
      const STEP = Math.min(0.14, Math.max(0.06, (dur - 3.2) / Math.max(1, names.length)));
      const T_SHOT = T_FIELD + names.length * STEP + 0.25;
      const FLY = 0.8;

      tl.from("#ground", { scale: 0.86, opacity: 0, duration: 0.8, ease: "expo.out", transformOrigin: "50% 50%" }, 0)
        .from("#ring", { scale: 0.6, opacity: 0, duration: 0.6, ease: "expo.out", transformOrigin: "50% 50%" }, 0.35)
        .from("#pitch", { scaleY: 0, duration: 0.45, ease: "power4.out", transformOrigin: "50% 50%" }, 0.5)
        .from("#kicker", { y: -20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.2)
        .from("#title .w", { opacity: 0, y: 24, duration: 0.5, ease: "expo.out", stagger: 0.08 }, 0.3);

      dots.forEach((d, i) => {
        const at = T_FIELD + i * STEP;
        tl.from(d.dot, { scale: 0, duration: 0.45, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, at)
          .from([d.lead, d.lbl], { opacity: 0, duration: 0.3, ease: "power2.out" }, at + 0.12);
        if (d.hot) {
          tl.fromTo(d.halo, { scale: 1, opacity: 1 }, { scale: 3.2, opacity: 0, duration: 0.7, ease: "power2.out",
            transformOrigin: "50% 50%", immediateRender: false }, at + 0.35);
        }
      });

      const target = spot(v.shot);
      if (target) {
        const label = String(v.shot_label || "").toUpperCase();
        const six = label.includes("SIX") || label.includes("6");
        const len = Math.hypot(target[0], target[1] + 11) || 1;
        const reach = six ? 104 : 94;
        const ex = target[0] / Math.hypot(target[0], target[1]) * reach;
        const ey = target[1] / Math.hypot(target[0], target[1]) * reach;
        const sx = 0, sy = -10;
        const cx = (sx + ex) / 2 + (ey - sy) * (six ? 0.18 : 0.06), cy = (sy + ey) / 2 - (ex - sx) * (six ? 0.18 : 0.06);
        const trail = HF.$("#trail");
        trail.setAttribute("d", `M${sx} ${sy} Q${cx} ${cy} ${ex} ${ey}`);
        const total = trail.getTotalLength();
        trail.setAttribute("stroke-dasharray", `${total} ${total}`);
        const ball = HF.$("#ball");
        const fly = { p: 0 };
        const place = () => {
          const u = fly.p, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
          ball.setAttribute("cx", a * sx + b * cx + c * ex);
          ball.setAttribute("cy", a * sy + b * cy + c * ey);
          ball.setAttribute("r", 1.9 + (six ? 1.6 : 0.4) * Math.sin(Math.PI * u));  // rises towards the camera
          trail.setAttribute("stroke-dashoffset", total * (1 - u));
        };
        place();
        tl.set([trail, ball], { opacity: 1 }, T_SHOT)
          .to(fly, { p: 1, duration: FLY, ease: "power2.inOut", onUpdate: place }, T_SHOT);
        const hit = HF.$("#hit");
        hit.textContent = label;
        hit.setAttribute("x", Math.max(-80, Math.min(80, ex * 0.72)));
        hit.setAttribute("y", Math.max(-70, Math.min(85, ey * 0.72)));
        tl.fromTo(hit, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out",
          transformOrigin: "50% 50%", immediateRender: false }, T_SHOT + FLY);
        HF.shake(tl, "#field", T_SHOT + FLY, 10);
      }
      const T_NOTE = target ? T_SHOT + FLY + 0.35 : T_FIELD + names.length * STEP + 0.2;
      tl.from("#note", { opacity: 0, y: 30, duration: 0.6, ease: "expo.out" }, Math.min(T_NOTE, dur - 1.0));
      tl.to("#scene", { opacity: 0, duration: 0.25, ease: "power2.in" }, dur - 0.25);
      tl.seek(0);
    </script>
  </body>
</html>
