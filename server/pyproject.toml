[project]
name = "hfpipe"
version = "0.1.0"
description = "Cricket motion-graphics pipeline: captions -> Claude plan -> HyperFrames renders -> CutAgent bundle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "opencv-python-headless<5",
    "pillow-heif>=1.8.1",
]

[project.optional-dependencies]
# Mirror the usage log to Firestore: uv sync --extra firebase, then set HF_FIREBASE_CREDENTIALS in .env
firebase = ["firebase-admin>=6.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "fonttools>=4.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hfpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
